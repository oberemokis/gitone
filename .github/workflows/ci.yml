# Одна работа на всё: линт, тесты и сборка Go идут за секунды, и делить их на
# параллельные работы значило бы трижды ставить Go ради выигрыша, которого нет.
#
# Имя работы «проверки» ждёт защита main: слияние пул-реквеста разрешено только
# при ней зелёной. Переименование работы снимает защиту молча, поэтому вместе с
# ним правится и защита ветки.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Толчок поверх незаконченного прогона его отменяет: проверять имеет смысл
# только последний коммит ветки.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Версия Go одна для машины разработчика и CI, она записана в go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Те же цели, что запускаются руками перед пул-реквестом: расхождение
      # между локальной проверкой и CI хуже любой из них.
      - run: make lint
      - run: make test
      - run: make build
