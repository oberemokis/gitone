# Релиз выходит по тегу vX.Y.Z: git tag vX.Y.Z && git push origin vX.Y.Z.
# Расписания нет: выпуск это решение, а не таймер.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: релиз
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Релиз не уходит, если проверки на теге красные: те же цели, что в CI.
      - run: make lint
      - run: make test

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
