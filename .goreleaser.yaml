# Сборка релиза: шесть бинарников (darwin, linux и windows, amd64 и arm64).
# Каждый лежит дважды: в архиве с версией в имени (tar.gz, на Windows zip) для
# ручной установки и отдельным файлом без версии, gitone_<os>_<arch>[.exe],
# для install.sh, install.ps1 и gitone update. Такой файл скачивается по
# прямой ссылке «последний релиз», распаковывать нечего. checksums.txt
# охватывает все файлы. Запускает workflow release.yml по тегу vX.Y.Z.
#
# Релиз создаётся черновиком, а release.yml публикует его после загрузки всех
# файлов: иначе «последний релиз» какое-то время указывал бы на релиз без
# файлов, и установка падала бы у всех. Предрелизные теги (v0.4.0-rc.1)
# последними не становятся.
#
# Формулы Homebrew здесь пока нет: нужен отдельный репозиторий-tap и токен для
# записи в него. Секция brews добавляется вместе с ними.
version: 2

project_name: gitone

# Без грамматик из GITONE_TAGS сборка берёт все двести, копилефтные тоже.
# Хук идёт через sh -c: goreleaser сам переменные в аргументах не раскрывает,
# и голый test -n "$GITONE_TAGS" сравнивал бы с литералом.
before:
  hooks:
    - sh -c 'test -n "$GITONE_TAGS"'

builds:
  - id: gitone
    main: ./cmd/gitone
    binary: gitone
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # грамматики подсветки из scripts/grammar-tags.sh: рабочие процессы
    # кладут вывод скрипта в GITONE_TAGS (#139)
    flags:
      - -tags={{ .Env.GITONE_TAGS }}
    # версия, которую печатает gitone --version
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: archives
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
  - id: binaries
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary

checksum:
  name_template: checksums.txt

release:
  draft: true
  prerelease: auto
